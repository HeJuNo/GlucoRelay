name: 0. Compile check (no signing)
run-name: Compile check (${{ github.ref_name }})

# Unsigned simulator build + unit tests. Needs no secrets, so it also runs on forks/PRs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and run unit tests
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Using simulator $SIM_ID"
          xcodebuild test \
            -project GlucoRelay.xcodeproj \
            -scheme GlucoRelay \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*(Sendable|isolat|concurren)|Test Case|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
