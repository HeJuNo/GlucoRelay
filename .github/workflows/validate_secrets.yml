name: 1. Secrets pruefen
run-name: Secrets pruefen (${{ github.ref_name }})

on:
  workflow_dispatch:
  workflow_call:

jobs:
  access:
    name: GitHub-Zugang
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: GH_PAT pruefen
        run: |
          set -o pipefail
          if [ -z "$GH_PAT" ]; then
            echo "::error::Das Secret GH_PAT fehlt oder ist leer."
            exit 2
          fi
          if ! curl -sS -f -o /dev/null -H "Authorization: token $GH_PAT" https://api.github.com/user; then
            echo "::error::Mit GH_PAT ist keine Anmeldung bei GitHub moeglich. Token pruefen/erneuern unter https://github.com/settings/tokens (Berechtigungen: repo, workflow)."
            exit 2
          fi
          scopes=$(curl -sS -I -H "Authorization: token $GH_PAT" https://api.github.com | { grep -i '^x-oauth-scopes:' || true; } | cut -d ' ' -f2- | tr -d '\r')
          if [ -n "$scopes" ] && ! [[ $scopes =~ repo ]]; then
            echo "::error::GH_PAT hat nicht die Berechtigung 'repo' (vorhanden: $scopes)."
            exit 2
          fi
          echo "GH_PAT ist gueltig."

      - name: Match-Secrets-Repository pruefen/anlegen
        run: |
          REPO="${{ github.repository_owner }}/Match-Secrets"
          if ! visibility=$(gh repo view "$REPO" --json visibility | jq -r '.visibility | ascii_downcase'); then
            echo "$REPO nicht gefunden – wird als privates Repository angelegt ..."
            if gh repo create "$REPO" --private >/dev/null; then
              echo "$REPO wurde angelegt."
            else
              echo "::error::$REPO konnte nicht angelegt werden. Bitte manuell als PRIVATES Repository anlegen."
              exit 2
            fi
          elif [ "$visibility" != "private" ]; then
            echo "::error::$REPO ist oeffentlich. Bitte auf privat stellen – sonst liegen die (verschluesselten) Zertifikate offen."
            exit 2
          else
            echo "Privates $REPO gefunden."
          fi

  fastlane:
    name: Apple-Zugang
    needs: access
    runs-on: macos-26
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      TEAMID: ${{ secrets.TEAMID }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Abhaengigkeiten installieren
        run: bundle install

      - name: Uhr synchronisieren
        run: sudo sntp -sS time.windows.com

      - name: Secrets pruefen
        run: |
          failed=""
          if [ -z "$TEAMID" ]; then failed=1; echo "::error::TEAMID fehlt.";
          elif ! [[ $TEAMID =~ ^[A-Z0-9]{10}$ ]]; then failed=1; echo "::error::TEAMID muss aus 10 Grossbuchstaben/Ziffern bestehen."; fi

          [ -z "$MATCH_PASSWORD" ] && { failed=1; echo "::error::MATCH_PASSWORD fehlt."; }
          [ -z "$FASTLANE_KEY_ID" ] && { failed=1; echo "::error::FASTLANE_KEY_ID fehlt."; }
          [ -z "$FASTLANE_ISSUER_ID" ] && { failed=1; echo "::error::FASTLANE_ISSUER_ID fehlt."; }
          [ -z "$FASTLANE_KEY" ] && { failed=1; echo "::error::FASTLANE_KEY fehlt."; }

          if [ -n "$FASTLANE_KEY_ID" ] && ! [[ $FASTLANE_KEY_ID =~ ^[A-Z0-9]{10}$ ]]; then
            failed=1; echo "::error::FASTLANE_KEY_ID ist ungueltig (10 Zeichen, A-Z/0-9)."
          fi
          if [ -n "$FASTLANE_ISSUER_ID" ] && ! [[ $FASTLANE_ISSUER_ID =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]]; then
            failed=1; echo "::error::FASTLANE_ISSUER_ID ist ungueltig (UUID-Format)."
          fi
          if [ -n "$FASTLANE_KEY" ] && ! echo "$FASTLANE_KEY" | openssl pkcs8 -nocrypt >/dev/null 2>&1; then
            failed=1; echo "::error::FASTLANE_KEY ist ungueltig. Den kompletten Inhalt der .p8-Datei inkl. BEGIN/END-Zeilen einfuegen."
          fi
          [ -n "$failed" ] && exit 2

          set -o pipefail
          if ! bundle exec fastlane validate_secrets 2>&1 | tee fastlane.log; then
            if grep -q "Couldn't decrypt the repo" fastlane.log; then
              echo "::error::Match-Secrets laesst sich mit MATCH_PASSWORD nicht entschluesseln."
            elif grep -q -e "required agreement" -e "license agreement" fastlane.log; then
              echo "::error::Bitte die aktuelle Apple-Developer-Vereinbarung auf https://developer.apple.com/account akzeptieren und es erneut versuchen."
            elif grep -q "Your certificate .* is not valid" fastlane.log; then
              echo "::notice::Distribution-Zertifikat ungueltig/abgelaufen – es wird beim Zertifikats-Workflow erneuert."
              exit 0
            fi
            exit 2
          fi
